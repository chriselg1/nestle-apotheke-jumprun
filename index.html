<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Nestle-Apotheke — Der Botendienst-Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div id="frame">
    <canvas id="stage" width="960" height="540"></canvas>

  </div>

  <div id="touch" aria-hidden="true">
    <div class="cluster">
      <button class="pad" data-key="left">◀</button>
      <button class="pad" data-key="right">▶</button>
    </div>
    <div class="cluster">
      <button class="pad jump" data-key="jump">▲</button>
    </div>
  </div>

  <div id="rotate" aria-hidden="true">
    <div class="card">
      <div class="icon">📱⟳</div>
      <p><strong>Bitte das Handy quer drehen</strong><br>— dann macht der Botendienst-Sprint richtig Spaß!</p>
    </div>
  </div>

  <p id="hint">
    <strong>◀ ▶</strong> oder <strong>A / D</strong> laufen &nbsp;·&nbsp;
    <strong>Leertaste</strong> springen &nbsp;·&nbsp;
    <strong>Enter</strong> weiter &nbsp;·&nbsp;
    <strong>R</strong> Level neu
  </p>

  <script src="js/config.js?v=4"></script>
  <script src="js/levels.js?v=5"></script>
  <script src="js/engine.js?v=5"></script>
  <script src="js/entities.js?v=5"></script>
  <script src="js/render.js?v=2"></script>
  <script src="js/screens.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
</body>
</html>
